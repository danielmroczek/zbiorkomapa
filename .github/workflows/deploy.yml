name: Deploy to zbiorkomapa.github.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://zbiorkomapa.github.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish to zbiorkomapa.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/site"
          mkdir -p "$work"
          cp -r public/. "$work/"
          touch "$work/.nojekyll"
          printf '%s\n' \
            '# zbiorkomapa.github.io' \
            '' \
            'Repo artefaktowe — zawartość jest wgrywana automatycznie.' \
            'Nie edytuj ręcznie: każdy deploy zastępuje całą historię.' \
            '' \
            'Źródło: https://github.com/danielmroczek/zbiorkomapa' \
            'Strona: https://zbiorkomapa.github.io/' > "$work/README.md"
          cd "$work"
          git init -q -b main
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Deploy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:$DEPLOY_TOKEN@github.com/zbiorkomapa/zbiorkomapa.github.io.git" main
